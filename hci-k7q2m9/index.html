<title>Highland Cabinetry in 3D</title>
<style>
/* Layout: the camera fills the screen; a title plate sits top-left, one hint line floats mid-screen, two buttons sit bottom-centre. Dark chrome that reads over any camera picture. */
:root{color-scheme:dark;--panel:rgba(10,14,46,.82);--line:rgba(255,255,255,.18);--ink:#f3f5ff;--muted:#aab2d8;--accent:#0FBDFF;--accent-ink:#04122c;--body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
html,body{height:100%;margin:0;background:#0c0e1a;color:var(--ink);font:14px/1.4 var(--body);overflow:hidden;overscroll-behavior:none}
[hidden]{display:none!important}
#gl{position:fixed;left:0;top:0;touch-action:none;z-index:2}
video{z-index:1!important}
.plate{position:fixed;z-index:5;top:calc(12px + env(safe-area-inset-top,0px));left:max(14px,env(safe-area-inset-left,0px));background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:flex;gap:10px;align-items:center;max-width:calc(100% - 28px);backdrop-filter:blur(8px)}
.plate img{height:26px;width:auto;display:block}.plate .t{font-weight:700;font-size:14px;line-height:1.15}.plate .s{color:var(--muted);font-size:11px}
.hint{position:fixed;z-index:5;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 18px;text-align:center;max-width:min(320px,calc(100% - 40px));backdrop-filter:blur(8px)}
.hint.low{top:auto;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:7px 14px;border-radius:999px;font-size:12px;white-space:nowrap}
.dock{position:fixed;z-index:5;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:8px;padding:0 14px}
button{font:600 14px var(--body);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 16px;cursor:pointer}
button.go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-size:16px;padding:14px 26px}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#start{position:fixed;inset:0;z-index:9;background:#0c0e1a;display:grid;place-items:center;padding:28px;text-align:center}
#start .box{max-width:340px;display:grid;gap:18px;justify-items:center}
#start img{max-width:220px;max-height:90px}
#start h1{font-size:22px;margin:0;line-height:1.2}#start p{margin:0;color:var(--muted)}
#start ol{margin:0;padding-left:20px;text-align:left;color:var(--ink);display:grid;gap:6px}
#start .by{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
#msg{color:#ffd9a8}
</style>
</head>
